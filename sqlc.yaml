version: "2"
sql:
  - engine: "postgresql"
    # not go code so go outside of internal
    queries: "db/queries" 
    schema: "db/migrations"
    gen:
      go:
        package: "db"
        sql_package: "pgx/v5"
        # sqlc generated go code will go to internal/
        out: "internal/database"
        emit_interface: true
